<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="emailpage.css">
</head>
<body>

  <div class="container">
    <!-- Left Side Content -->
    <div class="left-panel">
      <div class="brand-logo">Nexus</div>
      <h1>Explore the things <span>you love.</span></h1>
    </div>

    <!-- Right Side Content -->
    <div class="right-panel">
      <h2 class="form-title">Log in to Nexus</h2>
      
      <form action="#" method="POST" onsubmit="event.preventDefault();">
        <div class="input-group">
          <input type="text" placeholder="Email address or mobile number" required>
        </div>
        
        <div class="input-group">
          <input type="password" placeholder="Password" required>
        </div>
        
        <button type="submit" class="btn-login">Log in</button>
        
        <a href="#" class="forgot-password">Forgotten password?</a>
        
        <div class="divider"></div>
        
        <button type="button" class="btn-register">Create new account</button>
      </form>
    </div>
  </div>

</body>
</html>
